packages:
  - packages/*

allowBuilds:
  dprint: true
  esbuild: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Packages maintained by jeremybanka; keep in sync with renovate.json.
  - "@breakage/changesets"
  - agents.yaml
  - atom.io
  - breakage
  - comline
  - takua
  - treetrunks
  # The Vite Plus migrator may select freshly published toolchain packages.
  - vite-plus
  - "@voidzero-dev/*"
  - vitest
  - "@vitest/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - tsrs
  - "@tsrs/*"
verifyDepsBeforeRun: error
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  vitest: 5.1.1
  "@vitest/coverage-v8": 5.1.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
